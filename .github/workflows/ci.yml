name: CI
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/secret-scan.sh --tree
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Keyless on purpose: the suite must pass with no REDBARK_API_KEY (or any
      # other key) present: every network call is mocked, staleness degrades
      # loudly, never silently.
      - run: python -m pytest tests/ -q
